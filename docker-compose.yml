version: '3.9'

services:
  db:
    image: postgres:12.3-alpine
    environment:
      POSTGRES_DB: vantage
      POSTGRES_USER: vantage
      POSTGRES_PASSWORD: vantage_s3cur3
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - vantage_net
    restart: unless-stopped

  redis:
    image: redis:alpine
    networks:
      - vantage_net
    restart: unless-stopped

  web:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 vantage.asgi:application
    volumes:
      - ./backend:/app
      - scan_results:/app/scan_results
      - static_volume:/app/staticfiles
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - vantage_net
    restart: unless-stopped

  celery:
    build: ./backend
    command: celery -A vantage worker -l info -Q scan_queue,ai_queue,report_queue -c 4
    volumes:
      - ./backend:/app
      - scan_results:/app/scan_results
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - vantage_net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A vantage beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - vantage_net
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      - static_volume:/app/dist
    networks:
      - vantage_net

  proxy:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - scan_results:/app/scan_results
    depends_on:
      - web
      - frontend
    networks:
      - vantage_net
    restart: unless-stopped

volumes:
  postgres_data:
  scan_results:
  static_volume:

networks:
  vantage_net:
    driver: bridge
